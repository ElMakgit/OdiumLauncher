# Name: Разрешения на использование читов на сервере
# Description: Выберите, кто может использовать чит-режим JEI на этом сервере.
[permissions]
	# Name: Разрешить чит-режим для операторов
	# Description: Разрешить игрокам со статусом оператора (/op) использовать чит-режим JEI.
	# Valid Values: [true, false]
	# Default Value: true
	enableCheatModeForOp = true

	# Name: Разрешить чит-режим в творческом режиме
	# Description: Разрешить игрокам в творческом режиме использовать чит-режим JEI.
	# Valid Values: [true, false]
	# Default Value: true
	enableCheatModeForCreative = true

	# Name: Разрешить чит-режим при доступе к /give
	# Description: Разрешить игрокам, которые могут использовать команду /give, использовать чит-режим JEI.
	# Valid Values: [true, false]
	# Default Value: false
	enableCheatModeForGive = false


