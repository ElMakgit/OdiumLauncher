#JourneyMap Ore Heatmap Configuration
[general]
	#Enable the ore heatmap overlay
	enabled = false
	#Chunk scan radius around the player (1-8)
	# Default: 3
	# Range: 1 ~ 8
	scanRadius = 3
	#How often to update the overlay (in ticks, 20 = 1 second)
	# Default: 40
	# Range: 20 ~ 200
	updateIntervalTicks = 40
	#Opacity of the heatmap overlay (0.0 - 1.0)
	# Default: 0.6
	# Range: 0.1 ~ 1.0
	overlayOpacity = 0.6
	#Show the overlay in cave/underground maps
	showInCaves = true

#Ore tracking configuration
[ores]
	#List of ores to track.
	#Supports both block IDs and tags:
	#  - Block ID: "namespace:block_id" (e.g., "minecraft:diamond_ore")
	#  - Tag: "#namespace:tag" (e.g., "#c:ores" for all conventional ores)
	#The #c:ores tag includes all ores from vanilla and most mods.
	trackedOres = ["#c:ores"]
